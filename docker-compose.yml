services:
  identity-mysql:
    image: mysql:8.4
    container_name: blog-identity-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${IDENTITY_MYSQL_DATABASE:-blog_identity}
      MYSQL_USER: ${IDENTITY_DB_USERNAME:-identity_user}
      MYSQL_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_password}
      MYSQL_ROOT_PASSWORD: ${IDENTITY_MYSQL_ROOT_PASSWORD:-identity_root_password}
    ports:
      - "${IDENTITY_MYSQL_PORT:-3307}:3306"
    volumes:
      - identity_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  post-mysql:
    image: mysql:8.4
    container_name: blog-post-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${POST_MYSQL_DATABASE:-blog_posts}
      MYSQL_USER: ${POST_DB_USERNAME:-post_user}
      MYSQL_PASSWORD: ${POST_DB_PASSWORD:-post_password}
      MYSQL_ROOT_PASSWORD: ${POST_MYSQL_ROOT_PASSWORD:-post_root_password}
    ports:
      - "${POST_MYSQL_PORT:-3308}:3306"
    volumes:
      - post_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  content-mysql:
    image: mysql:8.4
    container_name: blog-content-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CONTENT_MYSQL_DATABASE:-blog_content}
      MYSQL_USER: ${CONTENT_DB_USERNAME:-content_user}
      MYSQL_PASSWORD: ${CONTENT_DB_PASSWORD:-content_password}
      MYSQL_ROOT_PASSWORD: ${CONTENT_MYSQL_ROOT_PASSWORD:-content_root_password}
    ports:
      - "${CONTENT_MYSQL_PORT:-3309}:3306"
    volumes:
      - content_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-mysql:
    image: mysql:8.4
    container_name: blog-notification-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${NOTIFICATION_MYSQL_DATABASE:-blog_notifications}
      MYSQL_USER: ${NOTIFICATION_DB_USERNAME:-notification_user}
      MYSQL_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_password}
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_MYSQL_ROOT_PASSWORD:-notification_root_password}
    ports:
      - "${NOTIFICATION_MYSQL_PORT:-3310}:3306"
    volumes:
      - notification_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: blog-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: blog-identity-service
    depends_on:
      identity-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-local}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: ${LOG_ENVIRONMENT:-local}
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: ${LOG_STACKTRACE_MAX_LENGTH:-16384}
      IDENTITY_DB_URL: jdbc:mysql://identity-mysql:3306/${IDENTITY_MYSQL_DATABASE:-blog_identity}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret-before-production-change-this-dev-secret-before-production}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-18000000}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-BLOG_ACCESS_TOKEN}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    expose:
      - "9092"
    labels:
      co.elastic.logs/enabled: "true"
    restart: unless-stopped

  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    container_name: blog-post-service
    depends_on:
      post-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-local}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: ${LOG_ENVIRONMENT:-local}
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: ${LOG_STACKTRACE_MAX_LENGTH:-16384}
      POST_DB_URL: jdbc:mysql://post-mysql:3306/${POST_MYSQL_DATABASE:-blog_posts}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      POST_DB_USERNAME: ${POST_DB_USERNAME:-post_user}
      POST_DB_PASSWORD: ${POST_DB_PASSWORD:-post_password}
      CATEGORY_SERVICE_BASE_URL: http://content-service:9094
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret-before-production-change-this-dev-secret-before-production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-this-internal-dev-token-before-production-change-this-internal-dev-token}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      POST_IMAGE_PATH: /app/images/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POST_PUBLISHED_TOPIC: ${POST_PUBLISHED_TOPIC:-blog.posts.published.v1}
    expose:
      - "9093"
    volumes:
      - uploaded_images:/app/images
    labels:
      co.elastic.logs/enabled: "true"
    restart: unless-stopped

  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    container_name: blog-content-service
    depends_on:
      content-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-local}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: ${LOG_ENVIRONMENT:-local}
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: ${LOG_STACKTRACE_MAX_LENGTH:-16384}
      CONTENT_DB_URL: jdbc:mysql://content-mysql:3306/${CONTENT_MYSQL_DATABASE:-blog_content}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      CONTENT_DB_USERNAME: ${CONTENT_DB_USERNAME:-content_user}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:-content_password}
      POST_SERVICE_BASE_URL: http://post-service:9093
      CONTENT_HTTP_CONNECT_TIMEOUT: ${CONTENT_HTTP_CONNECT_TIMEOUT:-2s}
      CONTENT_HTTP_READ_TIMEOUT: ${CONTENT_HTTP_READ_TIMEOUT:-5s}
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret-before-production-change-this-dev-secret-before-production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-this-internal-dev-token-before-production-change-this-internal-dev-token}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    expose:
      - "9094"
    labels:
      co.elastic.logs/enabled: "true"
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: blog-notification-service
    depends_on:
      notification-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-local}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: ${LOG_ENVIRONMENT:-local}
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: ${LOG_STACKTRACE_MAX_LENGTH:-16384}
      NOTIFICATION_DB_URL: jdbc:mysql://notification-mysql:3306/${NOTIFICATION_MYSQL_DATABASE:-blog_notifications}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-notification_user}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_NOTIFICATION_GROUP_ID: ${KAFKA_NOTIFICATION_GROUP_ID:-notification-service-v1}
      POST_PUBLISHED_TOPIC: ${POST_PUBLISHED_TOPIC:-blog.posts.published.v1}
      POST_PUBLISHED_DLT_TOPIC: ${POST_PUBLISHED_DLT_TOPIC:-blog.posts.published.v1.DLT}
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret-before-production-change-this-dev-secret-before-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    expose:
      - "9095"
    labels:
      co.elastic.logs/enabled: "true"
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: blog-api-gateway
    depends_on:
      identity-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-local}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: ${LOG_ENVIRONMENT:-local}
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: ${LOG_STACKTRACE_MAX_LENGTH:-16384}
      IDENTITY_BASE_URL: http://identity-service:9092
      POST_SERVICE_BASE_URL: http://post-service:9093
      CONTENT_SERVICE_BASE_URL: http://content-service:9094
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:9095
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-BLOG_ACCESS_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${GATEWAY_PORT:-9090}:9090"
    networks:
      default:
        aliases:
          - api-gateway
    labels:
      co.elastic.logs/enabled: "true"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: blog-mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    expose:
      - "1025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8025/livez || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: blog-alertmanager
    depends_on:
      mailpit:
        condition: service_healthy
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.enable-lifecycle
      - --cluster.listen-address=
      - --enable-feature=utf8-strict-mode
    ports:
      - "${ALERTMANAGER_PORT:-9097}:9093"
    volumes:
      - ./deploy/k8s/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/k8s/alertmanager/blog-platform.tmpl:/etc/alertmanager/templates/blog-platform.tmpl:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:9093/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: blog-prometheus
    depends_on:
      gateway:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9096}:9090"
    volumes:
      - ./deploy/k8s/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/k8s/prometheus/blog-platform.yml:/etc/prometheus/rules/blog-platform.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: blog-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-local-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/platform-overview.json
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/k8s/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./deploy/k8s/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/k8s/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    container_name: blog-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.1
    container_name: blog-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME: blog-platform-kibana
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ENABLED: "false"
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  logging-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    container_name: blog-logging-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    command: ["/bin/bash", "/usr/share/blog-platform/logging/setup-logging.sh"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KIBANA_URL: http://kibana:5601
    volumes:
      - ./deploy/k8s/logging:/usr/share/blog-platform/logging:ro
    restart: "no"

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.3.1
    container_name: blog-filebeat
    user: root
    depends_on:
      logging-setup:
        condition: service_completed_successfully
    command: ["filebeat", "-e", "-c", "/usr/share/filebeat/filebeat.yml", "--strict.perms=false"]
    volumes:
      - ./deploy/k8s/logging/filebeat.docker.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    restart: unless-stopped

volumes:
  identity_mysql_data:
  post_mysql_data:
  content_mysql_data:
  notification_mysql_data:
  kafka_data:
  uploaded_images:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  mailpit_data:
  elasticsearch_data:
  filebeat_data:
