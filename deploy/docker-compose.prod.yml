services:
  identity-mysql:
    image: mysql:8.4
    container_name: blog-prod-identity-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${IDENTITY_MYSQL_DATABASE:-blog_identity}
      MYSQL_USER: ${IDENTITY_DB_USERNAME:-identity_user}
      MYSQL_PASSWORD: ${IDENTITY_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${IDENTITY_MYSQL_ROOT_PASSWORD}
    volumes:
      - identity_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  post-mysql:
    image: mysql:8.4
    container_name: blog-prod-post-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${POST_MYSQL_DATABASE:-blog_posts}
      MYSQL_USER: ${POST_DB_USERNAME:-post_user}
      MYSQL_PASSWORD: ${POST_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${POST_MYSQL_ROOT_PASSWORD}
    volumes:
      - post_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  content-mysql:
    image: mysql:8.4
    container_name: blog-prod-content-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CONTENT_MYSQL_DATABASE:-blog_content}
      MYSQL_USER: ${CONTENT_DB_USERNAME:-content_user}
      MYSQL_PASSWORD: ${CONTENT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CONTENT_MYSQL_ROOT_PASSWORD}
    volumes:
      - content_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-mysql:
    image: mysql:8.4
    container_name: blog-prod-notification-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${NOTIFICATION_MYSQL_DATABASE:-blog_notifications}
      MYSQL_USER: ${NOTIFICATION_DB_USERNAME:-notification_user}
      MYSQL_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_MYSQL_ROOT_PASSWORD}
    volumes:
      - notification_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: blog-prod-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  identity-service:
    build:
      context: ../identity-service
      dockerfile: Dockerfile
    container_name: blog-prod-identity-service
    depends_on:
      identity-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-production}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: ${LOG_ENVIRONMENT:-production}
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: ${LOG_STACKTRACE_MAX_LENGTH:-16384}
      IDENTITY_DB_URL: jdbc:mysql://identity-mysql:3306/${IDENTITY_MYSQL_DATABASE:-blog_identity}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-18000000}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-BLOG_ACCESS_TOKEN}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "9092"
    labels:
      co.elastic.logs/enabled: "true"
    restart: unless-stopped

  post-service:
    build:
      context: ../post-service
      dockerfile: Dockerfile
    container_name: blog-prod-post-service
    depends_on:
      post-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-production}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: ${LOG_ENVIRONMENT:-production}
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: ${LOG_STACKTRACE_MAX_LENGTH:-16384}
      POST_DB_URL: jdbc:mysql://post-mysql:3306/${POST_MYSQL_DATABASE:-blog_posts}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      POST_DB_USERNAME: ${POST_DB_USERNAME:-post_user}
      POST_DB_PASSWORD: ${POST_DB_PASSWORD}
      CATEGORY_SERVICE_BASE_URL: http://content-service:9094
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      POST_IMAGE_PATH: /app/images/
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POST_PUBLISHED_TOPIC: ${POST_PUBLISHED_TOPIC:-blog.posts.published.v1}
    volumes:
      - uploaded_images:/app/images
    expose:
      - "9093"
    labels:
      co.elastic.logs/enabled: "true"
    restart: unless-stopped

  content-service:
    build:
      context: ../content-service
      dockerfile: Dockerfile
    container_name: blog-prod-content-service
    depends_on:
      content-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-production}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: ${LOG_ENVIRONMENT:-production}
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: ${LOG_STACKTRACE_MAX_LENGTH:-16384}
      CONTENT_DB_URL: jdbc:mysql://content-mysql:3306/${CONTENT_MYSQL_DATABASE:-blog_content}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      CONTENT_DB_USERNAME: ${CONTENT_DB_USERNAME:-content_user}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD}
      POST_SERVICE_BASE_URL: http://post-service:9093
      CONTENT_HTTP_CONNECT_TIMEOUT: ${CONTENT_HTTP_CONNECT_TIMEOUT:-2s}
      CONTENT_HTTP_READ_TIMEOUT: ${CONTENT_HTTP_READ_TIMEOUT:-5s}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "9094"
    labels:
      co.elastic.logs/enabled: "true"
    restart: unless-stopped

  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: blog-prod-notification-service
    depends_on:
      notification-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-production}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: ${LOG_ENVIRONMENT:-production}
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: ${LOG_STACKTRACE_MAX_LENGTH:-16384}
      NOTIFICATION_DB_URL: jdbc:mysql://notification-mysql:3306/${NOTIFICATION_MYSQL_DATABASE:-blog_notifications}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-notification_user}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_NOTIFICATION_GROUP_ID: ${KAFKA_NOTIFICATION_GROUP_ID:-notification-service-v1}
      POST_PUBLISHED_TOPIC: ${POST_PUBLISHED_TOPIC:-blog.posts.published.v1}
      POST_PUBLISHED_DLT_TOPIC: ${POST_PUBLISHED_DLT_TOPIC:-blog.posts.published.v1.DLT}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "9095"
    labels:
      co.elastic.logs/enabled: "true"
    restart: unless-stopped

  gateway:
    build:
      context: ../gateway-service
      dockerfile: Dockerfile
    container_name: blog-prod-api-gateway
    depends_on:
      identity-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-production}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: ${LOG_ENVIRONMENT:-production}
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: ${LOG_STACKTRACE_MAX_LENGTH:-16384}
      IDENTITY_BASE_URL: http://identity-service:9092
      POST_SERVICE_BASE_URL: http://post-service:9093
      CONTENT_SERVICE_BASE_URL: http://content-service:9094
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:9095
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-BLOG_ACCESS_TOKEN}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "9090"
    networks:
      default:
        aliases:
          - api-gateway
    labels:
      co.elastic.logs/enabled: "true"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: blog-prod-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.enable-lifecycle
      - --cluster.listen-address=
      - --enable-feature=utf8-strict-mode
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9097}:9093"
    volumes:
      - ./k8s/alertmanager/alertmanager.production.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./k8s/alertmanager/blog-platform.tmpl:/etc/alertmanager/templates/blog-platform.tmpl:ro
      - ./secrets/alertmanager-smtp-password:/run/secrets/alertmanager-smtp-password:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:9093/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: blog-prod-prometheus
    depends_on:
      gateway:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9096}:9090"
    volumes:
      - ./k8s/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./k8s/prometheus/blog-platform.yml:/etc/prometheus/rules/blog-platform.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: blog-prod-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/platform-overview.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./k8s/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./k8s/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./k8s/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    container_name: blog-prod-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.1
    container_name: blog-prod-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME: blog-platform-kibana
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  logging-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    container_name: blog-prod-logging-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    command: ["/bin/bash", "/usr/share/blog-platform/logging/setup-logging.sh"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KIBANA_URL: http://kibana:5601
    volumes:
      - ./k8s/logging:/usr/share/blog-platform/logging:ro
    restart: "no"

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.3.1
    container_name: blog-prod-filebeat
    user: root
    depends_on:
      logging-setup:
        condition: service_completed_successfully
    command: ["filebeat", "-e", "-c", "/usr/share/filebeat/filebeat.yml", "--strict.perms=false"]
    volumes:
      - ./k8s/logging/filebeat.docker.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    restart: unless-stopped

  frontend:
    build:
      context: ../../microservices-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    container_name: blog-prod-frontend
    expose:
      - "80"
    restart: unless-stopped

  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: blog-prod-caddy
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --header='Host: ${PUBLIC_DOMAIN}' --spider http://localhost/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  identity_mysql_data:
  post_mysql_data:
  content_mysql_data:
  notification_mysql_data:
  kafka_data:
  uploaded_images:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  elasticsearch_data:
  filebeat_data:
