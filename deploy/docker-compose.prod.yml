services:
  identity-mysql:
    image: mysql:8.4
    container_name: blog-prod-identity-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${IDENTITY_MYSQL_DATABASE:-blog_identity}
      MYSQL_USER: ${IDENTITY_DB_USERNAME:-identity_user}
      MYSQL_PASSWORD: ${IDENTITY_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${IDENTITY_MYSQL_ROOT_PASSWORD}
    volumes:
      - identity_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  post-mysql:
    image: mysql:8.4
    container_name: blog-prod-post-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${POST_MYSQL_DATABASE:-blog_posts}
      MYSQL_USER: ${POST_DB_USERNAME:-post_user}
      MYSQL_PASSWORD: ${POST_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${POST_MYSQL_ROOT_PASSWORD}
    volumes:
      - post_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  content-mysql:
    image: mysql:8.4
    container_name: blog-prod-content-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CONTENT_MYSQL_DATABASE:-blog_content}
      MYSQL_USER: ${CONTENT_DB_USERNAME:-content_user}
      MYSQL_PASSWORD: ${CONTENT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CONTENT_MYSQL_ROOT_PASSWORD}
    volumes:
      - content_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: ../identity-service
      dockerfile: Dockerfile
    container_name: blog-prod-identity-service
    depends_on:
      identity-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      IDENTITY_DB_URL: jdbc:mysql://identity-mysql:3306/${IDENTITY_MYSQL_DATABASE:-blog_identity}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-18000000}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "9092"
    restart: unless-stopped

  post-service:
    build:
      context: ../post-service
      dockerfile: Dockerfile
    container_name: blog-prod-post-service
    depends_on:
      post-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POST_DB_URL: jdbc:mysql://post-mysql:3306/${POST_MYSQL_DATABASE:-blog_posts}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      POST_DB_USERNAME: ${POST_DB_USERNAME:-post_user}
      POST_DB_PASSWORD: ${POST_DB_PASSWORD}
      CATEGORY_SERVICE_BASE_URL: http://content-service:9094
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      POST_IMAGE_PATH: /app/images/
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - uploaded_images:/app/images
    expose:
      - "9093"
    restart: unless-stopped

  content-service:
    build:
      context: ../content-service
      dockerfile: Dockerfile
    container_name: blog-prod-content-service
    depends_on:
      content-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONTENT_DB_URL: jdbc:mysql://content-mysql:3306/${CONTENT_MYSQL_DATABASE:-blog_content}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      CONTENT_DB_USERNAME: ${CONTENT_DB_USERNAME:-content_user}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD}
      POST_SERVICE_BASE_URL: http://post-service:9093
      CONTENT_HTTP_CONNECT_TIMEOUT: ${CONTENT_HTTP_CONNECT_TIMEOUT:-2s}
      CONTENT_HTTP_READ_TIMEOUT: ${CONTENT_HTTP_READ_TIMEOUT:-5s}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "9094"
    restart: unless-stopped

  gateway:
    build:
      context: ../gateway-service
      dockerfile: Dockerfile
    container_name: blog-prod-api-gateway
    depends_on:
      identity-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
    environment:
      IDENTITY_BASE_URL: http://identity-service:9092
      POST_SERVICE_BASE_URL: http://post-service:9093
      CONTENT_SERVICE_BASE_URL: http://content-service:9094
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "9090"
    restart: unless-stopped

  frontend:
    build:
      context: ../../microservices-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    container_name: blog-prod-frontend
    expose:
      - "80"
    restart: unless-stopped

  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: blog-prod-caddy
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --header='Host: ${PUBLIC_DOMAIN}' --spider http://localhost/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  identity_mysql_data:
  post_mysql_data:
  content_mysql_data:
  uploaded_images:
  caddy_data:
  caddy_config:
