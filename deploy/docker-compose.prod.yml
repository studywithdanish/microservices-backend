services:
  mysql:
    image: mysql:8.4
    container_name: blog-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_app_apis}
      MYSQL_USER: ${DB_USERNAME:-blog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-mysql:
    image: mysql:8.4
    container_name: blog-prod-identity-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${IDENTITY_MYSQL_DATABASE:-blog_identity}
      MYSQL_USER: ${IDENTITY_DB_USERNAME:-identity_user}
      MYSQL_PASSWORD: ${IDENTITY_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${IDENTITY_MYSQL_ROOT_PASSWORD}
    volumes:
      - identity_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: blog-prod-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-blog_app_apis}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-blog_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-18000000}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - uploaded_images:/app/images
    expose:
      - "9090"
    restart: unless-stopped

  identity-service:
    build:
      context: ../identity-service
      dockerfile: Dockerfile
    container_name: blog-prod-identity-service
    depends_on:
      identity-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      IDENTITY_DB_URL: jdbc:mysql://identity-mysql:3306/${IDENTITY_MYSQL_DATABASE:-blog_identity}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-18000000}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "9092"
    restart: unless-stopped

  gateway:
    build:
      context: ../gateway-service
      dockerfile: Dockerfile
    container_name: blog-prod-api-gateway
    depends_on:
      backend:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      BACKEND_BASE_URL: http://backend:9090
      IDENTITY_BASE_URL: http://identity-service:9092
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "9090"
    restart: unless-stopped

  frontend:
    build:
      context: ../../microservices-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    container_name: blog-prod-frontend
    expose:
      - "80"
    restart: unless-stopped

  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: blog-prod-caddy
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --header='Host: ${PUBLIC_DOMAIN}' --spider http://localhost/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mysql_data:
  identity_mysql_data:
  uploaded_images:
  caddy_data:
  caddy_config:
