apiVersion: 1

deleteDatasources:
  - name: Tempo
    orgId: 1
  - name: Blog Platform Logs
    orgId: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      search:
        hide: false
      tracesToLogsV2:
        datasourceUid: elasticsearch
        spanStartTimeShift: -2s
        spanEndTimeShift: 2s
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: 'traceId:"$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        tags:
          - key: service.name
            value: application
      serviceMap:
        datasourceUid: prometheus

  - name: Blog Platform Logs
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    editable: false
    jsonData:
      index: blog-platform-logs-*
      interval: Daily
      timeField: '@timestamp'
      logMessageField: message
      logLevelField: log.level
      dataLinks:
        - field: traceId
          datasourceUid: tempo
          url: '$${__value.raw}'
