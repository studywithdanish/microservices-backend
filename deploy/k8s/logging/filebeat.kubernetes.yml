filebeat.autodiscover:
  providers:
    - type: kubernetes
      node: ${NODE_NAME}
      hints.enabled: true
      hints.default_config:
        enabled: false
        type: filestream
        id: kubernetes-container-${data.kubernetes.pod.uid}-${data.kubernetes.container.id}
        prospector.scanner.symlinks: true
        parsers:
          - container:
              stream: all
              format: auto
        paths:
          - /var/log/containers/*-${data.kubernetes.container.id}.log

processors:
  - decode_json_fields:
      fields: [message]
      target: ""
      overwrite_keys: true
      add_error_key: true
      when.regexp.message: '^\s*\{'
  - add_fields:
      target: event
      fields:
        dataset: blog-platform.application
  - add_kubernetes_metadata:
      host: ${NODE_NAME}
      matchers:
        - logs_path:
            logs_path: /var/log/containers/

output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
  index: "blog-platform-logs-%{+yyyy.MM.dd}"
  bulk_max_size: 512

setup.template.enabled: false
setup.ilm.enabled: false

queue.mem:
  events: 2048
  flush.min_events: 256
  flush.timeout: 5s

logging.level: info
logging.to_files: false
