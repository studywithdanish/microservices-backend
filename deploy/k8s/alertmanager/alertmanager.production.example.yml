global:
  resolve_timeout: 5m
  smtp_from: alerts@example.com
  smtp_smarthost: smtp.example.com:587
  smtp_auth_username: alerts@example.com
  smtp_auth_password_file: /run/secrets/alertmanager-smtp-password
  smtp_require_tls: true

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: backend-warning-email
  group_by:
    - alertname
    - team
    - severity
    - service
    - application
    - journey
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: backend-critical-email
      matchers:
        - 'severity="critical"'
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 30m
    - receiver: backend-warning-email
      matchers:
        - 'severity="warning"'
      repeat_interval: 4h

receivers:
  - name: backend-warning-email
    email_configs:
      - to: backend-team@example.com
        send_resolved: true
        headers:
          Subject: '{{ template "blog.email.subject" . }}'
        text: '{{ template "blog.email.text" . }}'
        html: '{{ template "blog.email.html" . }}'

  - name: backend-critical-email
    email_configs:
      - to: on-call@example.com
        send_resolved: true
        headers:
          Subject: '{{ template "blog.email.subject" . }}'
        text: '{{ template "blog.email.text" . }}'
        html: '{{ template "blog.email.html" . }}'

inhibit_rules:
  - source_matchers:
      - 'severity="critical"'
      - 'slo=~".+"'
    target_matchers:
      - 'severity="warning"'
      - 'slo=~".+"'
    equal:
      - service
      - slo

  - source_matchers:
      - 'severity="critical"'
    target_matchers:
      - 'severity="warning"'
    equal:
      - alertname
      - service

  - source_matchers:
      - 'alertname="BlogServiceDown"'
    target_matchers:
      - 'severity="warning"'
    equal:
      - service

  - source_matchers:
      - 'alertname="BlogSyntheticProbeFailed"'
    target_matchers:
      - 'alertname="BlogSyntheticProbeSlow"'
    equal:
      - service
      - journey
