global:
  resolve_timeout: 5m
  smtp_from: alerts@blog-platform.local
  smtp_smarthost: mailpit:1025
  smtp_require_tls: false

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: backend-warning-email
  group_by:
    - alertname
    - team
    - severity
    - service
    - application
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: backend-critical-email
      matchers:
        - 'severity="critical"'
      group_wait: 5s
      group_interval: 2m
      repeat_interval: 30m
    - receiver: backend-warning-email
      matchers:
        - 'severity="warning"'
      repeat_interval: 4h

receivers:
  - name: backend-warning-email
    email_configs:
      - to: backend-team@blog-platform.local
        send_resolved: true
        headers:
          Subject: '{{ template "blog.email.subject" . }}'
        text: '{{ template "blog.email.text" . }}'
        html: '{{ template "blog.email.html" . }}'

  - name: backend-critical-email
    email_configs:
      - to: on-call@blog-platform.local
        send_resolved: true
        headers:
          Subject: '{{ template "blog.email.subject" . }}'
        text: '{{ template "blog.email.text" . }}'
        html: '{{ template "blog.email.html" . }}'

inhibit_rules:
  - source_matchers:
      - 'severity="critical"'
      - 'slo=~".+"'
    target_matchers:
      - 'severity="warning"'
      - 'slo=~".+"'
    equal:
      - service
      - slo

  - source_matchers:
      - 'severity="critical"'
    target_matchers:
      - 'severity="warning"'
    equal:
      - alertname
      - service

  - source_matchers:
      - 'alertname="BlogServiceDown"'
    target_matchers:
      - 'severity="warning"'
    equal:
      - service
