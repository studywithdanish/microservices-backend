apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blog-platform
resources:
  - namespace.yaml
  - configmap.yaml
  - mysql.yaml
  - kafka.yaml
  - applications.yaml
  - frontend.yaml
  - prometheus.yaml
  - grafana.yaml
  - alertmanager.yaml
  - logging.yaml
  - tracing.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus/prometheus.yml
      - prometheus/blog-platform.yml
  - name: grafana-provisioning
    files:
      - prometheus.yml=grafana/provisioning/datasources/prometheus.yml
      - tempo.yml=grafana/provisioning/datasources/tempo.yml
      - dashboards.yml=grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboards
    files:
      - grafana/dashboards/platform-overview.json
      - grafana/dashboards/event-pipeline.json
      - grafana/dashboards/service-detail.json
  - name: alertmanager-config
    files:
      - alertmanager.yml=alertmanager/alertmanager.yml
      - blog-platform.tmpl=alertmanager/blog-platform.tmpl
  - name: logging-config
    files:
      - filebeat.kubernetes.yml=logging/filebeat.kubernetes.yml
      - setup-logging.sh=logging/setup-logging.sh
      - ilm-policy.json=logging/ilm-policy.json
      - index-template.json=logging/index-template.json
  - name: tracing-config
    files:
      - otel-collector.yml=tracing/otel-collector.yml
      - tempo.yml=tracing/tempo.yml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: blog-platform
