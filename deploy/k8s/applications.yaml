apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: post-images
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  selector:
    app: identity-service
  ports:
    - name: http
      port: 9092
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: blog-identity-service:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9092
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: SPRING_PROFILES_ACTIVE
            - name: IDENTITY_DB_URL
              value: jdbc:mysql://identity-mysql:3306/blog_identity?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
            - name: IDENTITY_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: IDENTITY_DB_USERNAME
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: IDENTITY_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION_MS
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: JWT_EXPIRATION_MS
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: CORS_ALLOWED_ORIGINS
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: post-service
spec:
  selector:
    app: post-service
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: post-service
          image: blog-post-service:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9093
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: SPRING_PROFILES_ACTIVE
            - name: POST_DB_URL
              value: jdbc:mysql://post-mysql:3306/blog_posts?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
            - name: POST_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: POST_DB_USERNAME
            - name: POST_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: POST_DB_PASSWORD
            - name: CATEGORY_SERVICE_BASE_URL
              value: http://content-service:9094
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: INTERNAL_SERVICE_TOKEN
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: CORS_ALLOWED_ORIGINS
            - name: POST_IMAGE_PATH
              value: /app/images/
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: images
              mountPath: /app/images
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: post-images
---
