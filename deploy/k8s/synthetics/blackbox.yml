modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: true
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0

  spring_health:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: true
      valid_status_codes:
        - 200
      fail_if_body_not_matches_regexp:
        - '"status"\s*:\s*"UP"'
