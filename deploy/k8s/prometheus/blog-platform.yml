groups:
  - name: blog-platform-recording
    interval: 30s
    rules:
      - record: blog:http_requests:rate5m
        expr: sum by (application) (rate(http_server_requests_seconds_count[5m]))

      - record: blog:http_server_errors:rate5m
        expr: sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))

      - record: blog:http_server_errors:ratio5m
        expr: blog:http_server_errors:rate5m / clamp_min(blog:http_requests:rate5m, 0.001)

      - record: blog:http_server_latency:p95_5m
        expr: histogram_quantile(0.95, sum by (application, le) (rate(http_server_requests_seconds_bucket[5m])))

      - record: blog:outbox_pending:max
        expr: max by (application) (blog_outbox_pending)

  - name: blog-platform-alerts
    rules:
      - alert: BlogServiceDown
        expr: up{job="blog-services"} == 0
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "{{ $labels.service }} is not being scraped"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for more than two minutes."
          runbook: docs/observability-phase-2.md#service-down

      - alert: BlogHighHttp5xxRatio
        expr: (blog:http_server_errors:ratio5m > 0.05) and on (application) (blog:http_requests:rate5m > 0.1)
        for: 10m
        labels:
          severity: warning
          team: backend
          service: "{{ $labels.application }}"
        annotations:
          summary: "High HTTP 5xx ratio for {{ $labels.application }}"
          description: "More than 5% of requests have returned HTTP 5xx for ten minutes."
          runbook: docs/observability-phase-2.md#high-http-5xx-ratio

      - alert: BlogHighHttpP95Latency
        expr: blog:http_server_latency:p95_5m > 2
        for: 10m
        labels:
          severity: warning
          team: backend
          service: "{{ $labels.application }}"
        annotations:
          summary: "High p95 latency for {{ $labels.application }}"
          description: "The 5-minute p95 server latency has exceeded two seconds for ten minutes."
          runbook: docs/observability-phase-2.md#high-http-p95-latency

      - alert: BlogOutboxBacklog
        expr: blog:outbox_pending:max > 50
        for: 10m
        labels:
          severity: warning
          team: backend
          service: "{{ $labels.application }}"
        annotations:
          summary: "Post event outbox backlog is growing"
          description: "{{ $labels.application }} has more than 50 unpublished events for ten minutes."
          runbook: docs/observability-phase-2.md#outbox-backlog

      - alert: BlogOutboxPublishFailure
        expr: sum by (application) (increase(blog_outbox_events_total{outcome="publish_failure"}[5m])) > 0
        labels:
          severity: warning
          team: backend
          service: "{{ $labels.application }}"
        annotations:
          summary: "Post event publishing failed"
          description: "At least one outbox event failed to publish during the last five minutes."
          runbook: docs/observability-phase-2.md#event-publishing-failure

      - alert: BlogKafkaDeadLetterEvent
        expr: sum by (application) (increase(blog_kafka_post_published_events_total{outcome="dead_letter"}[5m])) > 0
        labels:
          severity: warning
          team: backend
          service: "{{ $labels.application }}"
        annotations:
          summary: "A PostPublished event reached the dead-letter topic"
          description: "Notification processing exhausted its retries during the last five minutes."
          runbook: docs/observability-phase-2.md#event-publishing-failure

      - alert: PrometheusRuleEvaluationFailure
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Prometheus rule evaluation is failing"
          description: "Prometheus reported one or more rule evaluation failures during the last five minutes."
          runbook: docs/observability-phase-2.md#prometheus-rule-failure

      - alert: AlertmanagerDown
        expr: up{job="monitoring", component="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
          service: alertmanager
        annotations:
          summary: "Alertmanager is not reachable"
          description: "Prometheus has been unable to deliver alerts to Alertmanager for more than two minutes."
          runbook: docs/observability-phase-4.md#alertmanager-down

      - alert: AlertmanagerNotificationFailure
        expr: increase(alertmanager_notifications_failed_total[5m]) > 0
        labels:
          severity: critical
          team: platform
          service: alertmanager
        annotations:
          summary: "Alertmanager notification delivery is failing"
          description: "At least one receiver notification failed during the last five minutes."
          runbook: docs/observability-phase-4.md#notification-delivery-failure

      - alert: AlertmanagerConfigReloadFailure
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          team: platform
          service: alertmanager
        annotations:
          summary: "Alertmanager configuration reload failed"
          description: "Alertmanager has rejected its current configuration for at least five minutes."
          runbook: docs/observability-phase-4.md#configuration-reload-failure

  - name: blog-platform-slo-recording
    interval: 30s
    rules:
      - record: blog:slo_http_requests:rate5m
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*|UNKNOWN"}[5m]))

      - record: blog:slo_http_errors:ratio5m
        expr: (sum by (application) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*|UNKNOWN"}[5m])) or on (application) (0 * blog:slo_http_requests:rate5m)) / clamp_min(blog:slo_http_requests:rate5m, 0.001)

      - record: blog:slo_http_slow:ratio5m
        expr: 1 - (sum by (application) (rate(http_server_requests_seconds_bucket{le="2.0",uri!~"/actuator.*|UNKNOWN"}[5m])) / clamp_min(blog:slo_http_requests:rate5m, 0.001))

      - record: blog:slo_http_requests:rate30m
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*|UNKNOWN"}[30m]))

      - record: blog:slo_http_errors:ratio30m
        expr: (sum by (application) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*|UNKNOWN"}[30m])) or on (application) (0 * blog:slo_http_requests:rate30m)) / clamp_min(blog:slo_http_requests:rate30m, 0.001)

      - record: blog:slo_http_slow:ratio30m
        expr: 1 - (sum by (application) (rate(http_server_requests_seconds_bucket{le="2.0",uri!~"/actuator.*|UNKNOWN"}[30m])) / clamp_min(blog:slo_http_requests:rate30m, 0.001))

      - record: blog:slo_http_requests:rate1h
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*|UNKNOWN"}[1h]))

      - record: blog:slo_http_errors:ratio1h
        expr: (sum by (application) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*|UNKNOWN"}[1h])) or on (application) (0 * blog:slo_http_requests:rate1h)) / clamp_min(blog:slo_http_requests:rate1h, 0.001)

      - record: blog:slo_http_slow:ratio1h
        expr: 1 - (sum by (application) (rate(http_server_requests_seconds_bucket{le="2.0",uri!~"/actuator.*|UNKNOWN"}[1h])) / clamp_min(blog:slo_http_requests:rate1h, 0.001))

      - record: blog:slo_http_requests:rate6h
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*|UNKNOWN"}[6h]))

      - record: blog:slo_http_errors:ratio6h
        expr: (sum by (application) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*|UNKNOWN"}[6h])) or on (application) (0 * blog:slo_http_requests:rate6h)) / clamp_min(blog:slo_http_requests:rate6h, 0.001)

      - record: blog:slo_http_slow:ratio6h
        expr: 1 - (sum by (application) (rate(http_server_requests_seconds_bucket{le="2.0",uri!~"/actuator.*|UNKNOWN"}[6h])) / clamp_min(blog:slo_http_requests:rate6h, 0.001))

      - record: blog:slo_http_requests:rate3d
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*|UNKNOWN"}[3d]))

      - record: blog:slo_http_errors:ratio3d
        expr: (sum by (application) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*|UNKNOWN"}[3d])) or on (application) (0 * blog:slo_http_requests:rate3d)) / clamp_min(blog:slo_http_requests:rate3d, 0.001)

      - record: blog:slo_http_slow:ratio3d
        expr: 1 - (sum by (application) (rate(http_server_requests_seconds_bucket{le="2.0",uri!~"/actuator.*|UNKNOWN"}[3d])) / clamp_min(blog:slo_http_requests:rate3d, 0.001))

      - record: blog:slo_http_requests:rate30d
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*|UNKNOWN"}[30d]))

      - record: blog:slo_http_errors:ratio30d
        expr: (sum by (application) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*|UNKNOWN"}[30d])) or on (application) (0 * blog:slo_http_requests:rate30d)) / clamp_min(blog:slo_http_requests:rate30d, 0.001)

      - record: blog:slo_http_slow:ratio30d
        expr: 1 - (sum by (application) (rate(http_server_requests_seconds_bucket{le="2.0",uri!~"/actuator.*|UNKNOWN"}[30d])) / clamp_min(blog:slo_http_requests:rate30d, 0.001))

      - record: blog:slo_http_availability:ratio30d
        labels:
          objective: "0.995"
          window: 30d
        expr: 1 - blog:slo_http_errors:ratio30d

      - record: blog:slo_http_availability:error_budget_remaining30d
        labels:
          objective: "0.995"
          window: 30d
        expr: clamp_max(clamp_min((blog:slo_http_availability:ratio30d - 0.995) / 0.005, 0), 1)

      - record: blog:slo_http_latency:ratio30d
        labels:
          objective: "0.95"
          threshold: 2s
          window: 30d
        expr: 1 - blog:slo_http_slow:ratio30d

      - record: blog:slo_http_latency:error_budget_remaining30d
        labels:
          objective: "0.95"
          threshold: 2s
          window: 30d
        expr: clamp_max(clamp_min((blog:slo_http_latency:ratio30d - 0.95) / 0.05, 0), 1)

  - name: blog-platform-slo-alerts
    interval: 30s
    rules:
      - alert: BlogAvailabilitySloFastBurn
        expr: (blog:slo_http_errors:ratio5m / 0.005 > 14.4) and on (application) (blog:slo_http_errors:ratio1h / 0.005 > 14.4) and on (application) (blog:slo_http_requests:rate1h > 0.01)
        for: 2m
        labels:
          severity: critical
          team: backend
          service: "{{ $labels.application }}"
          slo: availability
        annotations:
          summary: "Availability error budget is burning rapidly for {{ $labels.application }}"
          description: "The 99.5% availability SLO is burning faster than 14.4x in both the 5-minute and 1-hour windows."
          runbook: docs/observability-phase-8.md#fast-burn-availability-or-latency

      - alert: BlogAvailabilitySloSlowBurn
        expr: (blog:slo_http_errors:ratio6h / 0.005 > 1) and on (application) (blog:slo_http_errors:ratio3d / 0.005 > 1) and on (application) (blog:slo_http_requests:rate6h > 0.01)
        for: 15m
        labels:
          severity: warning
          team: backend
          service: "{{ $labels.application }}"
          slo: availability
        annotations:
          summary: "Availability error budget is burning persistently for {{ $labels.application }}"
          description: "The 99.5% availability SLO is burning above its sustainable rate in both the 6-hour and 3-day windows."
          runbook: docs/observability-phase-8.md#slow-burn-availability-or-latency

      - alert: BlogLatencySloFastBurn
        expr: (blog:slo_http_slow:ratio5m / 0.05 > 14.4) and on (application) (blog:slo_http_slow:ratio1h / 0.05 > 14.4) and on (application) (blog:slo_http_requests:rate1h > 0.01)
        for: 2m
        labels:
          severity: critical
          team: backend
          service: "{{ $labels.application }}"
          slo: latency
        annotations:
          summary: "Latency error budget is burning rapidly for {{ $labels.application }}"
          description: "The 95% under two seconds latency SLO is burning faster than 14.4x in both the 5-minute and 1-hour windows."
          runbook: docs/observability-phase-8.md#fast-burn-availability-or-latency

      - alert: BlogLatencySloSlowBurn
        expr: (blog:slo_http_slow:ratio6h / 0.05 > 1) and on (application) (blog:slo_http_slow:ratio3d / 0.05 > 1) and on (application) (blog:slo_http_requests:rate6h > 0.01)
        for: 15m
        labels:
          severity: warning
          team: backend
          service: "{{ $labels.application }}"
          slo: latency
        annotations:
          summary: "Latency error budget is burning persistently for {{ $labels.application }}"
          description: "The 95% under two seconds latency SLO is burning above its sustainable rate in both the 6-hour and 3-day windows."
          runbook: docs/observability-phase-8.md#slow-burn-availability-or-latency
