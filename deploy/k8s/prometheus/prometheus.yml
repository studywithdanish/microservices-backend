global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    platform: blog-platform

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: blog-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:9090
        labels:
          service: api-gateway
      - targets:
          - identity-service:9092
        labels:
          service: identity-service
      - targets:
          - post-service:9093
        labels:
          service: post-service
      - targets:
          - content-service:9094
        labels:
          service: content-service
      - targets:
          - notification-service:9095
        labels:
          service: notification-service

  - job_name: monitoring
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          component: alertmanager

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115
        labels:
          component: blackbox-exporter

  - job_name: synthetic-http
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/synthetic-targets.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - target_label: __address__
        replacement: blackbox-exporter:9115
