global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    platform: blog-platform

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: blog-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:9090
        labels:
          service: api-gateway
      - targets:
          - identity-service:9092
        labels:
          service: identity-service
      - targets:
          - post-service:9093
        labels:
          service: post-service
      - targets:
          - content-service:9094
        labels:
          service: content-service
      - targets:
          - notification-service:9095
        labels:
          service: notification-service
