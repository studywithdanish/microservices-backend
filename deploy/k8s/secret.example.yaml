apiVersion: v1
kind: Secret
metadata:
  name: blog-secrets
  namespace: blog-platform
type: Opaque
stringData:
  JWT_SECRET: replace-with-at-least-64-random-characters
  INTERNAL_SERVICE_TOKEN: replace-with-a-separate-random-token
  IDENTITY_DB_PASSWORD: replace-with-a-strong-password
  IDENTITY_MYSQL_ROOT_PASSWORD: replace-with-a-different-strong-password
  POST_DB_PASSWORD: replace-with-a-strong-password
  POST_MYSQL_ROOT_PASSWORD: replace-with-a-different-strong-password
  CONTENT_DB_PASSWORD: replace-with-a-strong-password
  CONTENT_MYSQL_ROOT_PASSWORD: replace-with-a-different-strong-password
