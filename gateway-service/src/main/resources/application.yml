server:
  port: ${GATEWAY_PORT:9090}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              order: -10
              uri: ${IDENTITY_BASE_URL:http://localhost:9092}
              predicates:
                - Path=/api/v1/auth/**,/api/users,/api/users/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: post-service
              order: -5
              uri: ${POST_SERVICE_BASE_URL:http://localhost:9093}
              predicates:
                - Path=/api/posts,/api/posts/search/**,/api/post/**,/api/user/*/posts,/api/user/*/category/*/posts,/api/category/*/posts
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: content-service
              order: -4
              uri: ${CONTENT_SERVICE_BASE_URL:http://localhost:9094}
              predicates:
                - Path=/api/categories,/api/categories/**,/api/posts/*/comments,/api/comments/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: notification-service
              order: -3
              uri: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:9095}
              predicates:
                - Path=/api/notifications,/api/notifications/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:127\.0\.0\.1|10\..*|172\.(1[6-9]|2[0-9]|3[0-1])\..*|192\.168\..*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Blogging Platform API Gateway
    description: Public routing boundary for independently owned blogging services
    version: 6.0.0
