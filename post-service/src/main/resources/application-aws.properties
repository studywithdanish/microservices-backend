app.image.storage.provider=s3
app.image.storage.s3.bucket=${POST_IMAGE_S3_BUCKET}
app.image.storage.s3.region=${AWS_REGION:eu-west-1}
app.image.storage.s3.key-prefix=${POST_IMAGE_S3_KEY_PREFIX:post-images}
app.image.storage.s3.endpoint=${POST_IMAGE_S3_ENDPOINT:}
app.image.storage.s3.path-style-access=${POST_IMAGE_S3_PATH_STYLE_ACCESS:false}
app.image.storage.s3.api-call-timeout=${POST_IMAGE_S3_API_CALL_TIMEOUT:10s}
app.image.storage.s3.api-call-attempt-timeout=${POST_IMAGE_S3_API_CALL_ATTEMPT_TIMEOUT:5s}
