spring.application.name=post-service
server.port=${POST_SERVER_PORT:9093}
server.shutdown=graceful

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.profiles.default=dev

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-production-change-this-dev-secret-before-production}
app.internal.service-token=${INTERNAL_SERVICE_TOKEN:change-this-internal-dev-token-before-production-change-this-internal-dev-token}
app.category-service.base-url=${CATEGORY_SERVICE_BASE_URL:http://localhost:9094}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.image.storage.provider=${IMAGE_STORAGE_PROVIDER:local}
app.image.storage.local-path=${POST_IMAGE_PATH:images/}
app.image.storage.max-size-bytes=${POST_IMAGE_MAX_SIZE_BYTES:10485760}
app.kafka.topics.post-published=${POST_PUBLISHED_TOPIC:blog.posts.published.v1}
app.kafka.outbox.enabled=${KAFKA_OUTBOX_ENABLED:true}
app.kafka.outbox.poll-interval-ms=${KAFKA_OUTBOX_POLL_INTERVAL_MS:1000}
app.kafka.outbox.publish-timeout-seconds=${KAFKA_PUBLISH_TIMEOUT_SECONDS:10}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.template.observation-enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.prometheus.metrics.export.enabled=true
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${METRICS_ENVIRONMENT:${spring.profiles.active:${spring.profiles.default:default}}}
management.metrics.tags.instance=${METRICS_INSTANCE:${HOSTNAME:local}}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,2s,5s
info.app.name=Blogging Platform Post Service
info.app.description=Owns posts, category snapshots, and post images
info.app.version=6.0.0
