spring.application.name=post-service
server.port=${POST_SERVER_PORT:9093}
server.shutdown=graceful

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.profiles.default=dev

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-production-change-this-dev-secret-before-production}
app.internal.service-token=${INTERNAL_SERVICE_TOKEN:change-this-internal-dev-token-before-production-change-this-internal-dev-token}
app.category-service.base-url=${CATEGORY_SERVICE_BASE_URL:http://localhost:9094}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.image.storage-path=${POST_IMAGE_PATH:images/}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Blogging Platform Post Service
info.app.description=Owns posts, category snapshots, and post images
info.app.version=5.0.0
