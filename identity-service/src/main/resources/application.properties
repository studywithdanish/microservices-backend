spring.application.name=identity-service
server.port=${IDENTITY_SERVER_PORT:9092}
server.shutdown=graceful

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.profiles.default=dev

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-production-change-this-dev-secret-before-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:18000000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Blogging Platform Identity Service
info.app.description=Owns authentication, users, roles, and JWT issuance
info.app.version=3.0.0
