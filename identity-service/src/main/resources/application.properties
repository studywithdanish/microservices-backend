spring.application.name=identity-service
server.port=${IDENTITY_SERVER_PORT:9092}
server.shutdown=graceful

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.profiles.default=dev

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-production-change-this-dev-secret-before-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:18000000}
app.auth.cookie-name=${AUTH_COOKIE_NAME:BLOG_ACCESS_TOKEN}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.prometheus.metrics.export.enabled=true
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${METRICS_ENVIRONMENT:${spring.profiles.active:${spring.profiles.default:default}}}
management.metrics.tags.instance=${METRICS_INSTANCE:${HOSTNAME:local}}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,2s,5s
info.app.name=Blogging Platform Identity Service
info.app.description=Owns authentication, users, roles, and JWT issuance
info.app.version=3.0.0
