spring.application.name=content-service
server.port=${CONTENT_SERVER_PORT:9094}
server.shutdown=graceful

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.profiles.default=dev

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-production-change-this-dev-secret-before-production}
app.internal.service-token=${INTERNAL_SERVICE_TOKEN:change-this-internal-dev-token-before-production-change-this-internal-dev-token}
app.post-service.base-url=${POST_SERVICE_BASE_URL:http://localhost:9093}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.http.connect-timeout=${CONTENT_HTTP_CONNECT_TIMEOUT:2s}
app.http.read-timeout=${CONTENT_HTTP_READ_TIMEOUT:5s}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Blogging Platform Content Service
info.app.description=Owns categories and comments
info.app.version=5.0.0
