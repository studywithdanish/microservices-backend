spring.application.name=blog-app-apis
server.port=9090

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.profiles.default=dev

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-production-change-this-dev-secret-before-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:18000000}
app.post-service.base-url=${POST_SERVICE_BASE_URL:http://localhost:9093}
app.internal.service-token=${INTERNAL_SERVICE_TOKEN:change-this-internal-dev-token-before-production-change-this-internal-dev-token}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.org.springframework.security=info

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=Blogging Platform Category and Comment Backend
info.app.description=Transitional backend that owns categories and comments until Phase 5
info.app.version=4.0.0
